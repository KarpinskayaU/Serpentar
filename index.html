<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Змейка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game-container">
    <h1 class="game-title">🐍 Змейка</h1>

    <div class="score-panel">
        <div class="score">Очки: <span id="current-score">0</span></div>
        <div class="record" id="record-panel" hidden>
            Рекорд: <span id="record-score">0</span>
        </div>
    </div>

    <div class="settings" id="settings">
        <label class="setting">
            <span>Размер поля:</span>
            <input type="number" id="field-size-input" min="5" max="20" value="10">
        </label>
        <label class="setting">
            <input type="checkbox" id="walls-kill-checkbox">
            <span>Стены убивают</span>
        </label>
    </div>

    <div id="game-field" class="game-field"></div>

    <button id="restart-btn" class="restart-btn" hidden>🔄 Начать заново</button>

    <p class="hint" id="hint">Нажмите Enter или Space, чтобы начать. Управление — стрелки.</p>
</main>

<script src="script.js"></script>
</body>
</html>
